---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go-version-file keeps this in step with go.mod instead of pinning a
      # version here that drifts. Dependencies are vendored, so the build
      # fetches no modules and there is nothing to cache.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # '*.go', not '.', so vendor/ is not walked. gofmt -l prints the files
      # it would change and exits 0 either way, so the emptiness is the test.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./*.go)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...
