---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go-version-file keeps this in step with go.mod instead of pinning a
      # version here that drifts. Dependencies are vendored, so the build
      # fetches no modules and there is nothing to cache.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # '*.go', not '.', so vendor/ is not walked. gofmt -l prints the files
      # it would change and exits 0 either way, so the emptiness is the test.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./*.go)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The locking code is split by platform, and ubuntu-latest compiles only
      # history_lock_unix.go -- so without this step the windows and aix files
      # are never built by anything. darwin is here because the README invites
      # a macOS credentials PR, and a contributor should find the tree already
      # compiling for their platform. Build only: the runner cannot execute
      # these binaries.
      - name: cross-compile
        run: |
          for target in windows/amd64 aix/ppc64 darwin/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done

      # Separate from the plain test step, not folded into it: -race needs cgo
      # and a C toolchain, so keeping both means a broken toolchain still
      # leaves the ordinary suite as signal.
      - name: test (race)
        run: go test -race ./...
